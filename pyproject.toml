
[project]
name = "bet-breed-mlops"
version = "0.1.0"
description = "Bet breed prediction deployment"
readme = "README.md"
authors = [
    { name = "Mohamedkhaled123-dot", email = "mohamedme5a12@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bentoml>=1.4.39",
    "dvc>=3.67.1",
    "evidently>=0.7.14",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "numpy>=2.5.3",
    "onnx>=1.23.1",
    "onnxruntime>=1.30.0",
    "onnxscript>=0.7.2",
    "opencv-python>=5.0.0.93",
    "openvino>=2026.4.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "prometheus-client>=0.26.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
bet-breed-mlops = "bet_breed_mlops:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "dvc-gdrive>=3.0.1",
    "locust>=2.46.7",
    "ruff>=0.16.10",
]



[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
