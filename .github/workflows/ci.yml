
name: CI-CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DVC_REMOTE: gdrive_remote
  IMAGE_NAME: ghcr.io/mohamedkhaled123-dot/bet-breed-mlops/bet-breed-api

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Dependencies
        run: |
          uv sync --frozen --dev
          uv pip install --python .venv/bin/python "dvc[gdrive]" "pyOpenSSL>=24.2.1"

      - name: Configure Google Drive Credentials
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GDRIVE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing secret GDRIVE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

          credentials_file="$RUNNER_TEMP/gdrive-service-account.json"
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          chmod 600 "$credentials_file"

          uv run dvc remote modify --local "$DVC_REMOTE" gdrive_use_service_account true
          uv run dvc remote modify --local "$DVC_REMOTE" gdrive_service_account_json_file_path "$credentials_file"

      - name: Pull DVC Data
        run: uv run dvc pull --remote "$DVC_REMOTE"

      - name: Run Ruff
        run: uv run ruff check src scripts tests

      - name: Run Tests
        run: uv run pytest

      - name: Run Model Quality Gate
        run: uv run python scripts/quality_gate.py

  build-and-push:
    name: Build and Push ONNX CPU Image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install DVC
        run: uv tool install "dvc[gdrive]"

      - name: Configure Google Drive Credentials
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GDRIVE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing secret GDRIVE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

          credentials_file="$RUNNER_TEMP/gdrive-service-account.json"
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          chmod 600 "$credentials_file"

          dvc remote modify --local "$DVC_REMOTE" gdrive_use_service_account true
          dvc remote modify --local "$DVC_REMOTE" gdrive_service_account_json_file_path "$credentials_file"

      - name: Pull DVC Model Artifacts
        run: dvc pull --remote "$DVC_REMOTE"

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
