
      - name: Install Dependencies
        run: |
          uv sync --frozen --dev
          uv pip install --python .venv/bin/python "dvc[gdrive]" "pyOpenSSL==24.2.1"

      - name: Diagnose Google Drive Dependencies
        run: |
          uv run python -m pip show pyOpenSSL cryptography oauth2client google-auth google-auth-httplib2 PyDrive2 dvc-gdrive
          uv run python -c "import OpenSSL, cryptography; print('pyOpenSSL:', OpenSSL.__version__); print('cryptography:', cryptography.__version__)"

      - name: Configure Google Drive Credentials
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GDRIVE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing secret GDRIVE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

          credentials_file="$RUNNER_TEMP/gdrive-service-account.json"
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          chmod 600 "$credentials_file"

          uv run dvc remote modify --local "$DVC_REMOTE" gdrive_use_service_account true
          uv run dvc remote modify --local "$DVC_REMOTE" gdrive_service_account_json_file_path "$credentials_file"
